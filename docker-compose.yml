services:
  app1: 
    build: ./app
    environment:
      INSTANCE_NAME: app1
    
  app2: 
    build: ./app
    environment:
      INSTANCE_NAME: app2

  nginx: 
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2