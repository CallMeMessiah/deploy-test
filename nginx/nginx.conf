events {}


http {
    
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    proxy_cache_path /tmp/nginx_cache keys_zone=next_cache:10m max_size=100m inactive=10m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=2r/s;

    upstream next_servers {
        server app1:3000;
        server app2:3000;
    }

    server {
        listen 80;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            proxy_pass http://next_servers;
        }

        location = /next.svg {
            proxy_pass http://next_servers;
            proxy_cache next_cache;
            proxy_cache_valid 200 1m;
            proxy_ignore_headers Cache-Control;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        }

        location /api/ {
            limit_req zone=api_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://next_servers;
        }
    }
}